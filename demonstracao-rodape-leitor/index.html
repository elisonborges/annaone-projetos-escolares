<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demonstração — Direitos autorais no leitor</title>
<style>*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#17202b;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}header{height:52px;background:#102b4e;display:flex;align-items:center;padding:0 18px}.bar{width:100%;max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.bar a,.tool{color:#dceeff;text-decoration:none;font-weight:800}.stage{height:calc(100dvh - 110px);display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto}#book{filter:drop-shadow(0 14px 24px #0008);flex:0 0 auto;transform-origin:center center;transition:transform .2s ease}.reading #book{transform:scale(1.16)}.page{background:#fff;overflow:hidden}.page canvas{width:100%;height:100%;display:block}.reading header{display:none}.reading .stage{height:calc(100dvh - 58px);padding:4px}.reading .controls{position:fixed;left:0;right:0;bottom:0;z-index:20}.loading{text-align:center;color:#d7e1eb}.controls{height:58px;display:flex;align-items:center;justify-content:center;gap:10px;background:#101820;padding:8px;position:sticky;bottom:0}.tool{border:1px solid #ffffff30;background:#ffffff12;border-radius:9px;padding:8px 12px;cursor:pointer}.tool:hover{background:#ffffff20}.count{min-width:92px;text-align:center;font-size:13px;color:#d7e1eb}.original{font-size:12px}.error{background:#fff;color:#7b2630;border-radius:14px;padding:24px;max-width:520px;text-align:center}@media(max-width:600px){.reading #book{transform:scale(1.06)}header{height:auto;padding:10px}.bar{align-items:flex-start}.original{display:none}.stage{padding:8px;height:calc(100vh - 116px);min-height:0}.tool{padding:8px 10px}}

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const BASE='https://wdlmfjxyuwgdiyukmpir.supabase.co/functions/v1/',KEY='sb_publishable_F2HfP-vkw7rLYSP-5oPTzQ_XMe_9O86',id=new URLSearchParams(location.search).get('id');let pf=null,total=0,current=0;const A4=210/297;
async function init(){try{if(!id){const list=await fetch(BASE+'public-library-list',{headers:{apikey:KEY}});if(!list.ok)throw Error('Catálogo indisponível.');const data=await list.json();const first=data.items?.[0];if(!first)throw Error('Não há e-books publicados para demonstrar.');location.replace(location.pathname+'?id='+encodeURIComponent(first.id));return}const r=await fetch(BASE+'public-library-pdf',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({id})}),x=await r.json();if(!r.ok)throw Error(x.error||'E-book indisponível.');original.href=x.url;const pdf=await pdfjsLib.getDocument(x.url).promise;total=pdf.numPages;const pages=[];for(let n=1;n<=total;n++){loading.textContent='Preparando página '+n+' de '+total+'...';const p=await pdf.getPage(n),vp=p.getViewport({scale:1.45}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;const d=document.createElement('div');d.className='page';d.appendChild(canvas);pages.push(d)}loading.remove();pages.forEach(p=>book.appendChild(p));createBook()}catch(e){loading.className='error';loading.textContent=e.message||'Não foi possível abrir este e-book.'}}
function fitDims(){const stage=document.querySelector('.stage'),portrait=stage.clientWidth<760;let h=stage.clientHeight-20,w=h*A4,maxW=(stage.clientWidth-24)/(portrait?1:2);if(w>maxW){w=maxW;h=w/A4}return{w:Math.max(180,Math.floor(w)),h:Math.max(255,Math.floor(h))}}
function createBook(){const d=fitDims();pf=new St.PageFlip(book,{width:d.w,height:d.h,size:'fixed',showCover:true,mobileScrollSupport:false,maxShadowOpacity:.45,usePortrait:true});pf.loadFromHTML(document.querySelectorAll('.page'));pf.on('flip',e=>{current=e.data;update()});update()}
function update(){count.textContent='Página '+(current+1)+' / '+total}
window.prev=()=>pf&&pf.flipPrev();window.next=()=>pf&&pf.flipNext();window.reading=async()=>{try{if(!document.fullscreenElement){document.body.classList.add('reading');await document.documentElement.requestFullscreen();readBtn.textContent='□ Sair da tela cheia'}else{await document.exitFullscreen()}}catch(e){document.body.classList.remove('reading');readBtn.textContent='▣ Tela cheia';console.warn(e)}};document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;document.body.classList.toggle('reading',on);readBtn.textContent=on?'□ Sair da tela cheia':'▣ Tela cheia'});readBtn.textContent='▣ Tela cheia';init();
</script></body></html>
