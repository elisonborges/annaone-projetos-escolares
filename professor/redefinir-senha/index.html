<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha — Projetos Escolares</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f6fb;font-family:Arial,sans-serif;color:#092747;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;width:min(100%,440px);padding:28px;border:1px solid #d2e0ee;border-radius:18px;box-shadow:0 12px 36px #09274715}h1{font-size:25px;margin:0 0 12px}p{line-height:1.55;color:#4d6580}label{display:block;font-weight:bold;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #b9cee1;border-radius:9px;font-size:16px}button{background:#1474b8;color:#fff;border:0;border-radius:9px;padding:13px;width:100%;font-size:15px;font-weight:bold;cursor:pointer;margin-top:20px}button:disabled{opacity:.6}a{color:#1474b8}#form{display:none}#status{min-height:24px}</style></head><body><main class="card"><h1>🔑 Definir nova senha</h1><p id="status" role="status">Verificando seu link de recuperação...</p><div id="form"><label for="password">Nova senha (mínimo de 8 caracteres)</label><input id="password" type="password" autocomplete="new-password" minlength="8"><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="8"><button id="save" type="button">Salvar nova senha</button></div><p><a href="../">Voltar ao login do professor</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://wdlmfjxyuwgdiyukmpir.supabase.co','sb_publishable_F2HfP-vkw7rLYSP-5oPTzQ_XMe_9O86',{auth:{detectSessionInUrl:false}});
const status=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save');
function show(t,ready=false){status.textContent=t;form.style.display=ready?'block':'none'}
async function init(){try{
const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
const error=query.get('error_description')||hash.get('error_description');if(error){show('O link não pôde ser validado ou expirou. Solicite outro pelo login.');return}
let verified=false;
if(query.get('token_hash')&&query.get('type')==='recovery'){const r=await sb.auth.verifyOtp({token_hash:query.get('token_hash'),type:'recovery'});if(r.error)throw r.error;verified=!!r.data.session}
else if(query.get('code')){const r=await sb.auth.exchangeCodeForSession(query.get('code'));if(r.error)throw r.error;verified=!!r.data.session}
else if(hash.get('access_token')&&hash.get('refresh_token')&&hash.get('type')==='recovery'){const r=await sb.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(r.error)throw r.error;verified=!!r.data.session}
if(!verified){show('Link de recuperação ausente ou inválido. Solicite um novo pelo login.');return}
history.replaceState(null,'',location.pathname);show('Link confirmado. Escolha uma nova senha.',true)
}catch(e){console.error('Recuperação de senha:',e.message);show('Não foi possível validar o link. Ele pode ter expirado ou já ter sido utilizado. Solicite outro pelo login.')}}
save.addEventListener('click',async()=>{const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8)return show('A senha deve ter pelo menos 8 caracteres.',true);if(p!==c)return show('As senhas não coincidem.',true);save.disabled=true;try{const {error}=await sb.auth.updateUser({password:p});if(error)throw error;await sb.auth.signOut();show('Senha alterada com sucesso! Volte ao login e entre com a nova senha.')}catch(e){show('Não foi possível salvar a senha: '+e.message,true)}finally{save.disabled=false}});
init();
</script></body></html>
